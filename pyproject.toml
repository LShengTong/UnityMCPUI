[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unity-mcp-local"
version = "0.1.0"
description = "Local Unity Editor MCP server for compatible MCP clients"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["jsonschema>=4.20,<5"]

[project.scripts]
unity-mcp = "unity_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unity_mcp"]
